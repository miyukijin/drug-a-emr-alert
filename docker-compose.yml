services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: drug-a-emr-alert/api:1.0.0
    environment:
      EMRALERT_LOG_LEVEL: INFO
      # EMRALERT_ALERT_THRESHOLD: "0.15"   # override the alert cut-off without rebuilding
    ports:
      - "8000:8000"          # exposed for the interactive API docs at http://localhost:8000/docs
    restart: unless-stopped

  web:
    build: ./frontend
    image: drug-a-emr-alert/web:1.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
