name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r backend/requirements-dev.txt -r ml/requirements.txt
      - run: python -m pytest ml/tests -q
      - run: cd backend && python -m pytest -q
  containers:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - name: smoke test through the web proxy
        run: |
          curl -fsS http://localhost:8080/health
          curl -fsS -X POST http://localhost:8080/api/v1/predict -H 'content-type: application/json' \
            -d '{"patient_age":71,"patient_gender":"F","num_conditions":2,"physician_type":"FAMILY MEDICINE","physician_state":"CA","location_type":"TELEHEALTH"}'
      - run: docker compose down
